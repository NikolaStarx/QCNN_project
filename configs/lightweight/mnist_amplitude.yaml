experiment_name: "mnist_amplitude_light"

data:
  dataset: "MNIST"
  encoding: "amplitude"
  num_qubits: 10
  num_classes: 2
  batch_size: 4
  num_train_samples: 64
  num_test_samples: 32

training:
  epochs: 3
  lr: 0.05
  optimizer: "Adam"
  save_start_epoch: 1
  save_interval: 1
  checkpoint_dir: "checkpoints/lightweight/mnist_amplitude"
  checkpoint_prefix: "mnist_amp_light"

environment:
  backend: "GPU"
  add_noise: false
