experiment_name: fashion_hybrid_noise25_mid
data:
  dataset: FashionMNIST
  encoding: hybrid
  num_qubits: 8
  num_classes: 2
  batch_size: 8
  num_train_samples: 256
  num_test_samples: 64
  label_subset:
  - 0
  - 7
  downsampled: true
  downsample_size: 8
  num_features: 64
training:
  epochs: 10
  lr: 0.008
  optimizer: Adam
  save_start_epoch: 1
  save_interval: 1
  checkpoint_dir: checkpoints_noise25/fashion_hybrid/noise_mid
  checkpoint_prefix: fashion_hybrid_noise25_mid
environment:
  backend: GPU
  add_noise: true
  noise:
    depolarizing_p1: 0.00015
    depolarizing_p2: 0.0015
