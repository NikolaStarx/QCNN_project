experiment_name: fashion_hybrid_noise21_low
data:
  dataset: FashionMNIST
  encoding: hybrid
  num_qubits: 12
  num_classes: 2
  batch_size: 8
  num_train_samples: 192
  num_test_samples: 48
  label_subset:
  - 0
  - 1
  num_features: 144
training:
  epochs: 4
  lr: 0.008
  optimizer: Adam
  save_start_epoch: 2
  save_interval: 2
  checkpoint_dir: checkpoints_noise21/fashion_hybrid/noise_low
  checkpoint_prefix: fashion_hybrid_noise21_low
environment:
  backend: GPU
  add_noise: true
  noise:
    depolarizing_p1: 5.0e-05
    depolarizing_p2: 0.0005
