experiment_name: fashion_angle_noise21_high
data:
  dataset: FashionMNIST
  encoding: angle
  num_qubits: 16
  num_classes: 2
  batch_size: 8
  num_train_samples: 192
  num_test_samples: 48
  label_subset:
  - 0
  - 1
  num_features: 16
training:
  epochs: 4
  lr: 0.008
  optimizer: Adam
  save_start_epoch: 2
  save_interval: 2
  checkpoint_dir: checkpoints_noise21/fashion_angle/noise_high
  checkpoint_prefix: fashion_angle_noise21_high
environment:
  backend: GPU
  add_noise: true
  noise:
    depolarizing_p1: 0.0006
    depolarizing_p2: 0.006
