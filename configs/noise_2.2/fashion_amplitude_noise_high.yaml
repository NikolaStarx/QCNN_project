experiment_name: fashion_amplitude_noise22_high
data:
  dataset: FashionMNIST
  encoding: amplitude
  num_qubits: 4
  num_classes: 2
  batch_size: 64
  num_train_samples: 4096
  num_test_samples: 1024
  label_subset:
  - 4
  - 5
  downsampled: true
training:
  epochs: 10
  lr: 0.008
  optimizer: Adam
  save_start_epoch: 1
  save_interval: 1
  checkpoint_dir: checkpoints_noise22/fashion_amplitude/noise_high
  checkpoint_prefix: fashion_amplitude_noise22_high
environment:
  backend: GPU
  add_noise: true
  noise:
    depolarizing_p1: 0.0007
    depolarizing_p2: 0.007
