experiment_name: fashion_angle_noise22_mid
data:
  dataset: FashionMNIST
  encoding: angle
  num_qubits: 16
  num_classes: 2
  batch_size: 64
  num_train_samples: 4096
  num_test_samples: 1024
  label_subset:
  - 4
  - 5
  num_features: 16
  downsampled: true
training:
  epochs: 10
  lr: 0.008
  optimizer: Adam
  save_start_epoch: 1
  save_interval: 1
  checkpoint_dir: checkpoints_noise22/fashion_angle/noise_mid
  checkpoint_prefix: fashion_angle_noise22_mid
environment:
  backend: GPU
  add_noise: true
  noise:
    depolarizing_p1: 0.0003
    depolarizing_p2: 0.003
