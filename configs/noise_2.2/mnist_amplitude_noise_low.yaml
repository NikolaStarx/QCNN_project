experiment_name: mnist_amplitude_noise22_low
data:
  dataset: MNIST
  encoding: amplitude
  num_qubits: 4
  num_classes: 2
  batch_size: 64
  num_train_samples: 4096
  num_test_samples: 1024
  label_subset:
  - 6
  - 7
  downsampled: true
training:
  epochs: 10
  lr: 0.008
  optimizer: Adam
  save_start_epoch: 1
  save_interval: 1
  checkpoint_dir: checkpoints_noise22/mnist_amplitude/noise_low
  checkpoint_prefix: mnist_amplitude_noise22_low
environment:
  backend: GPU
  add_noise: true
  noise:
    depolarizing_p1: 0.0001
    depolarizing_p2: 0.001
