experiment_name: fashion_amplitude_noise23_2_high
data:
  dataset: FashionMNIST
  encoding: amplitude
  num_qubits: 4
  num_classes: 2
  batch_size: 16
  num_train_samples: 256
  num_test_samples: 64
  label_subset:
  - 4
  - 5
  downsampled: true
training:
  epochs: 10
  lr: 0.008
  optimizer: Adam
  save_start_epoch: 1
  save_interval: 1
  checkpoint_dir: checkpoints_noise23_2/fashion_amplitude/noise_high
  checkpoint_prefix: fashion_amplitude_noise23_2_high
environment:
  backend: GPU
  add_noise: true
  noise:
    depolarizing_p1: 0.0004
    depolarizing_p2: 0.004
