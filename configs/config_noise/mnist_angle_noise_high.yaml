experiment_name: mnist_angle_noise_high
data:
  dataset: MNIST
  encoding: angle
  num_qubits: 16
  num_features: 16
  num_classes: 10
  batch_size: 8
  num_train_samples: 12000
  num_test_samples: 3000
training:
  epochs: 10
  lr: 0.01
  optimizer: Adam
  save_start_epoch: 3
  save_interval: 2
  checkpoint_dir: checkpoints/mnist_angle/noise_high
  checkpoint_prefix: mnist_angle_noise_high
environment:
  backend: GPU
  add_noise: true
  noise:
    depolarizing_p1: 0.005
    depolarizing_p2: 0.05
