experiment_name: fashion_amplitude_noise_low
data:
  dataset: FashionMNIST
  encoding: amplitude
  num_qubits: 10
  num_classes: 10
  batch_size: 32
  num_train_samples: 30000
  num_test_samples: 5000
training:
  epochs: 10
  lr: 0.01
  optimizer: Adam
  save_start_epoch: 3
  save_interval: 2
  checkpoint_dir: checkpoints/fashion_amplitude/noise_low
  checkpoint_prefix: fashion_amp_noise_low
environment:
  backend: GPU
  add_noise: true
  noise:
    depolarizing_p1: 0.0005
    depolarizing_p2: 0.005
