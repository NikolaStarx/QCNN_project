experiment_name: mnist_angle_cnn_4x4

data:
  dataset: MNIST
  encoding: angle
  num_qubits: 16           # retained for compatibility; unused by train_cnn
  num_classes: 2
  batch_size: 8
  num_train_samples: 256
  num_test_samples: 64
  label_subset:
    - 6
    - 7
  downsampled: true
  num_features: 16

training:
  epochs: 10
  lr: 0.008
  optimizer: Adam
  save_start_epoch: 1
  save_interval: 1
  checkpoint_dir: checkpoints_cnn/noise23/mnist_angle_4x4
  checkpoint_prefix: cnn_mnist_angle_4x4

environment:
  backend: GPU
  add_noise: false
