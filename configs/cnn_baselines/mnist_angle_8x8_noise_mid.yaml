experiment_name: mnist_angle_cnn_8x8_noise_mid

data:
  dataset: MNIST
  encoding: angle
  num_qubits: 16
  num_classes: 2
  batch_size: 8
  num_train_samples: 256
  num_test_samples: 64
  label_subset:
    - 6
    - 7
  downsampled: true
  downsample_size: 8
  num_features: 64

training:
  epochs: 10
  lr: 0.008
  optimizer: Adam
  save_start_epoch: 1
  save_interval: 1
  checkpoint_dir: checkpoints_cnn/noise24/mnist_angle_8x8_mid
  checkpoint_prefix: cnn_mnist_angle_8x8_noise_mid

environment:
  backend: GPU
  add_noise: true
  noise:
    depolarizing_p1: 1.5e-04
    depolarizing_p2: 0.0015
  classical_noise:
    schedule:
      type: constant
    scale: 5.0
