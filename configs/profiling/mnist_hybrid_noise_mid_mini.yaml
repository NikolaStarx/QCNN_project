experiment_name: mnist_hybrid_noise_mid_mini
data:
  dataset: MNIST
  encoding: hybrid
  num_qubits: 12
  num_features: 144
  num_classes: 10
  batch_size: 16
  num_train_samples: 1024
  num_test_samples: 512
training:
  epochs: 5
  lr: 0.01
  optimizer: Adam
  save_start_epoch: 2
  save_interval: 1
  checkpoint_dir: checkpoints/profiling/mnist_hybrid_noise_mid_mini
  checkpoint_prefix: mnist_hybrid_noise_mid_mini
environment:
  backend: GPU
  add_noise: true
  noise:
    depolarizing_p1: 0.001
    depolarizing_p2: 0.01
