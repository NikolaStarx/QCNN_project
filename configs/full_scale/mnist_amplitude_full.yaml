experiment_name: "mnist_amplitude_full_v1"

data:
  dataset: "MNIST"
  encoding: "amplitude"
  num_qubits: 10           # amplitude 使用较少的 qubits
  num_classes: 10          # 全量 10 类数字识别
  batch_size: 32
  num_train_samples: 30000 # 比本机更大规模
  num_test_samples: 5000

training:
  epochs: 10
  lr: 0.01
  optimizer: "Adam"
  # Checkpoint settings (适配最新版 train.py)
  save_start_epoch: 3
  save_interval: 2
  checkpoint_dir: "checkpoints/mnist_amplitude"
  checkpoint_prefix: "mnist_amp"

environment:
  backend: "GPU"
  add_noise: false
