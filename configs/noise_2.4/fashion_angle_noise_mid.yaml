experiment_name: fashion_angle_noise23_4_mid
data:
  dataset: FashionMNIST
  encoding: angle
  num_qubits: 16
  num_classes: 2
  batch_size: 8
  num_train_samples: 256
  num_test_samples: 64
  label_subset:
  - 4
  - 5
  downsampled: true
  downsample_size: 8
  num_features: 64
training:
  epochs: 10
  lr: 0.008
  optimizer: Adam
  save_start_epoch: 1
  save_interval: 1
  checkpoint_dir: checkpoints_noise23_4/fashion_angle/noise_mid
  checkpoint_prefix: fashion_angle_noise23_4_mid
environment:
  backend: GPU
  add_noise: true
  noise:
    depolarizing_p1: 0.00015
    depolarizing_p2: 0.0015
