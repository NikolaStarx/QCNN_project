experiment_name: mnist_amplitude_noise23_4_high
data:
  dataset: MNIST
  encoding: amplitude
  num_qubits: 6
  num_classes: 2
  batch_size: 16
  num_train_samples: 256
  num_test_samples: 64
  label_subset:
  - 6
  - 7
  downsampled: true
  downsample_size: 8
training:
  epochs: 10
  lr: 0.008
  optimizer: Adam
  save_start_epoch: 1
  save_interval: 1
  checkpoint_dir: checkpoints_noise23_4/mnist_amplitude/noise_high
  checkpoint_prefix: mnist_amplitude_noise23_4_high
environment:
  backend: GPU
  add_noise: true
  noise:
    depolarizing_p1: 0.0004
    depolarizing_p2: 0.004
