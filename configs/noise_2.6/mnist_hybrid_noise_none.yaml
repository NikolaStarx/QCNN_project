experiment_name: mnist_hybrid_noise26_none

data:
  dataset: MNIST
  encoding: hybrid
  num_qubits: 8
  num_classes: 2
  batch_size: 8
  num_train_samples: 256
  num_test_samples: 64
  label_subset:
    - 6
    - 7
  downsampled: true
  num_features: 16

training:
  epochs: 10
  lr: 0.008
  optimizer: Adam
  save_start_epoch: 1
  save_interval: 1
  checkpoint_dir: checkpoints_noise26/mnist_hybrid/noise_none
  checkpoint_prefix: mnist_hybrid_noise26_none

model:
  conv_depth: 3

environment:
  backend: GPU
  add_noise: false
