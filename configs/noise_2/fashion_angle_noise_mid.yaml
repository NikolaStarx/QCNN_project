experiment_name: fashion_angle_noise2_mid
data:
  dataset: FashionMNIST
  encoding: angle
  num_qubits: 16
  num_classes: 2
  batch_size: 6
  num_train_samples: 3000
  num_test_samples: 600
  label_subset:
  - 0
  - 1
  num_features: 16
training:
  epochs: 10
  lr: 0.01
  optimizer: Adam
  save_start_epoch: 3
  save_interval: 2
  checkpoint_dir: checkpoints_noise2/fashion_angle/noise_mid
  checkpoint_prefix: fashion_angle_noise2_mid
environment:
  backend: GPU
  add_noise: true
  noise:
    depolarizing_p1: 0.0006
    depolarizing_p2: 0.006
