experiment_name: mnist_hybrid_noise25_4_high
data:
  dataset: MNIST
  encoding: hybrid
  num_qubits: 8
  num_features: 64
  num_classes: 2
  batch_size: 8
  num_train_samples: 512
  num_test_samples: 128
  label_subset:
  - 0
  - 1
  downsampled: true
  downsample_size: 8
  hybrid_scale: 4.0
training:
  epochs: 10
  lr: 0.006
  optimizer: Adam
  save_start_epoch: 1
  save_interval: 1
  checkpoint_dir: checkpoints_noise25_4/mnist_hybrid/noise_high
  checkpoint_prefix: mnist_hybrid_noise25_4_high
environment:
  backend: GPU
  add_noise: true
  noise:
    depolarizing_p1: 0.0004
    depolarizing_p2: 0.004
