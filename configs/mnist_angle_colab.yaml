experiment_name: "mnist_angle_colab_v1"

data:
  dataset: "MNIST"
  encoding: "angle"
  num_qubits: 16           # angle 使用最多的 qubits（需与 num_features 相等且为平方数）
  num_features: 16         # 4x4 补丁；与 num_qubits 相等，满足 encoders/angle.py 的要求
  num_classes: 10
  batch_size: 8
  num_train_samples: 12000
  num_test_samples: 3000

training:
  epochs: 10
  lr: 0.01
  optimizer: "Adam"
  save_start_epoch: 3
  save_interval: 2
  checkpoint_dir: "checkpoints/mnist_angle"
  checkpoint_prefix: "mnist_angle"

environment:
  backend: "GPU"
  add_noise: false

