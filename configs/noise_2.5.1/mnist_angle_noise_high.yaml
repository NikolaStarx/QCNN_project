experiment_name: mnist_angle_noise25_1_high
data:
  dataset: MNIST
  encoding: angle
  num_qubits: 16
  num_classes: 2
  batch_size: 8
  num_train_samples: 256
  num_test_samples: 64
  label_subset:
  - 0
  - 1
  downsampled: true
  downsample_size: 8
  num_features: 64
  normalise_features: true
  angle_scale: 3.0
training:
  epochs: 10
  lr: 0.008
  optimizer: Adam
  save_start_epoch: 1
  save_interval: 1
  checkpoint_dir: checkpoints_noise25_1/mnist_angle/noise_high
  checkpoint_prefix: mnist_angle_noise25_1_high
environment:
  backend: GPU
  add_noise: true
  noise:
    depolarizing_p1: 0.0004
    depolarizing_p2: 0.004
